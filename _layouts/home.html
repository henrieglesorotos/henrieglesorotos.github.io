<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f0e8">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/media/profile.png' | relative_url }}" type="image/png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    {% if site.google_analytics %}{% include google-analytics.html %}{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Henri Egle Sorotos, home">
        <img src="{{ '/media/profile.png' | relative_url }}" alt="" width="44" height="44">
        <span>Henri Egle Sorotos</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="#focus">Focus</a>
        <a href="#work">Work</a>
        <a href="#elsewhere">Elsewhere</a>
      </nav>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__route" aria-hidden="true"><span></span><span></span><span></span></div>
      <div>
        <p>Henri Egle Sorotos</p>
        <p>Knowledge engineering, AI and the occasional train.</p>
      </div>
      <div class="site-footer__links">
        <a href="https://github.com/henrieglesorotos">GitHub <span aria-hidden="true">↗</span></a>
        <a href="https://www.linkedin.com/in/henrieglesorotos/">LinkedIn <span aria-hidden="true">↗</span></a>
      </div>
      <p class="site-footer__copyright">© {{ 'now' | date: '%Y' }} · London, UK</p>
    </footer>
  </body>
</html>
